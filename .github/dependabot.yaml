version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      # Monday at 9am JST
      timezone: "Asia/Tokyo"
      time: "09:00"
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # Pub workspaces must resolve from the repository root; sub-package entries
  # fail with "Only apply dependency_services to the root of the workspace."
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "daily"
      # Monday at 9am JST
      timezone: "Asia/Tokyo"
      time: "09:00"
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
