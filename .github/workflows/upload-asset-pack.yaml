name: Verify Asset Pack on R2

on:
  repository_dispatch:
    types: [asset_pack_released]
  workflow_dispatch:
    inputs:
      pack_version:
        description: "R2 Asset Pack version (for example 1.2.3)"
        required: true
        type: string
      sha256:
        description: "Expected archive SHA-256 from the backend release"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.pack_version || inputs.pack_version }}
  cancel-in-progress: false

env:
  ASSET_PACK_BASE_URL: https://assets.eqmonitor.app/v1/assets
  ASSET_PACK_SIGNING_KEY_ID: asset-pack-2026-08-16

jobs:
  verify-r2-publication:
    name: Verify signed public R2 artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve trigger inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.pack_version }}
          DISPATCH_SHA256: ${{ github.event.client_payload.sha256 }}
          MANUAL_VERSION: ${{ inputs.pack_version }}
          MANUAL_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            version="$MANUAL_VERSION"
            sha256="$MANUAL_SHA256"
          else
            version="$DISPATCH_VERSION"
            sha256="$DISPATCH_SHA256"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::pack_version must be MAJOR.MINOR.PATCH'
            exit 1
          fi
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::sha256 must be 64 lowercase hex characters'
            exit 1
          fi
          {
            echo "version=$version"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Download public manifest, signature, and immutable archive
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output manifest.json "$ASSET_PACK_BASE_URL/manifest.json"
          curl --fail --location --retry 5 --retry-all-errors \
            --output manifest.sig "$ASSET_PACK_BASE_URL/manifest.sig"
          curl --fail --location --retry 5 --retry-all-errors \
            --output asset-pack.zip \
            "$ASSET_PACK_BASE_URL/packs/$VERSION/asset-pack-v$VERSION.zip"
          test -s manifest.json
          test -s manifest.sig
          test -s asset-pack.zip

      - name: Verify signature and signed archive metadata
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          SHA256: ${{ steps.inputs.outputs.sha256 }}
        run: |
          node tool/asset_pack/verify_r2_distribution.mjs \
            --manifest manifest.json \
            --signature manifest.sig \
            --archive asset-pack.zip \
            --version "$VERSION" \
            --sha256 "$SHA256" \
            --public-key \
            "$ASSET_PACK_SIGNING_KEY_ID=tool/asset_pack/trusted_keys/$ASSET_PACK_SIGNING_KEY_ID.pem"

      - name: Verify ZIP contents
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          SHA256: ${{ steps.inputs.outputs.sha256 }}
        run: tool/asset_pack/verify_zip.sh asset-pack.zip "$SHA256" "$VERSION" extracted
