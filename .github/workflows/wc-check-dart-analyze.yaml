name: Dart Analyze

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: de01d5daa62dcb2fd0378d55206c91e4cf008923
          path: .flutter-scene-sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Install Mise dependencies
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Verify pinned Flutter SDK
        run: |
          mise bootstrap repos status --missing
          mise exec -- flutter --version --machine

      - name: Precache Flutter Linux artifacts
        run: mise exec -- flutter precache --linux

      - name: Resolve dependencies
        run: mise exec -- dart pub get --enforce-lockfile

      - name: Analyze workspace
        run: mise exec -- dart run melos run analyze

      # https://github.com/invertase/github-action-dart-analyzer
      - name: Report analyze
        uses: invertase/github-action-dart-analyzer@e981b01a458d0bab71ee5da182e5b26687b7101b # v3.0.0
        with:
          fatal-infos: true
          working-directory: app

      # eqmonitor_custom_lints (avoid_direct_color_scheme 等) は
      # analysis_options.yaml の `plugins:` 経由で上記 dart analyze から
      # 既に実行されるため、ここではルール実装自体の回帰防止として
      # パッケージ単体のユニットテストのみ実行する。
      - name: Test eqmonitor_custom_lints
        working-directory: tools/eqmonitor_custom_lints
        run: |
          mise exec -- dart pub get
          mise exec -- dart test
