name: Detect changes

on:
  workflow_call:
    outputs:
      flutter:
        value: ${{ jobs.changes.outputs.flutter }}
      typescript:
        value: ${{ jobs.changes.outputs.typescript }}
      terraform:
        value: ${{ jobs.changes.outputs.terraform }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      typescript: ${{ steps.filter.outputs.typescript }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # https://github.com/dorny/paths-filter
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha || '' }}
          filters: |
            flutter:
              - 'app/**'
              - 'packages/**'
              - 'pubspec.lock'
              - 'mise.lock'
              - '.github/workflows/flutter.yaml'
              - '.github/workflows/wc-check-dart-*.yaml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/terraform.yaml'
              - '.github/workflows/wc-check-terraform-*.yaml'
