name: Detect changes

on:
  workflow_call:
    outputs:
      flutter:
        value: ${{ jobs.changes.outputs.flutter }}
      typescript:
        value: ${{ jobs.changes.outputs.typescript }}
      terraform:
        value: ${{ jobs.changes.outputs.terraform }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      typescript: ${{ steps.filter.outputs.typescript }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # https://github.com/dorny/paths-filter
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha || '' }}
          filters: |
            flutter:
              - 'app/**'
              - 'packages/**'
              - 'tools/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'mise.lock'
              - 'analysis_options.yaml'
              - '.github/workflows/flutter.yaml'
              - '.github/workflows/wc-check-dart-*.yaml'
              - '.github/workflows/pr-flutter-check.yaml'
              - '.github/workflows/wc-changes.yaml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/terraform.yaml'
              - '.github/workflows/wc-check-terraform-*.yaml'
