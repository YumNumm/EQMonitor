name: Create Beta Release

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version override (e.g. v3.1.0-beta.1). Empty for auto-detect."
        required: false
        type: string
      repair_existing_release:
        description: "Sanitize an existing beta release instead of creating one"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  create-beta:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        contains(github.event.issue.title, 'release') &&
        github.event.comment.body == '/beta'
      )
    steps:
      # https://github.com/actions/create-github-app-token
      - name: Generate eqmonitor GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.EQMONITOR_GITHUB_APP_ID }}
          private-key: ${{ secrets.EQMONITOR_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: "python"

      - name: Determine next beta version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
          PR_TITLE: ${{ github.event.issue.title || '' }}
          REPAIR_EXISTING_RELEASE: ${{ inputs.repair_existing_release || false }}
        run: |
          set -euo pipefail

          if [ "$REPAIR_EXISTING_RELEASE" = "true" ] && [ -z "$INPUT_VERSION" ]; then
            echo "::error::version is required when repairing an existing release"
            exit 1
          fi

          if [ -n "$INPUT_VERSION" ]; then
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract base version from Release PR title (e.g. "chore(main): release 3.1.0" -> "3.1.0")
          BASE_VERSION=$(echo "$PR_TITLE" | grep -oP '\d+\.\d+\.\d+' | head -1)
          if [ -z "$BASE_VERSION" ]; then
            echo "::error::Could not determine base version from PR title: $PR_TITLE"
            exit 1
          fi

          # Find the highest existing beta number for this version
          HIGHEST=$(git tag -l "v${BASE_VERSION}-beta.*" | sed 's/.*-beta\.//' | sort -n | tail -1)
          if [ -z "$HIGHEST" ]; then
            NEXT=1
          else
            NEXT=$((HIGHEST + 1))
          fi

          echo "version=v${BASE_VERSION}-beta.${NEXT}" >> "$GITHUB_OUTPUT"

      # タグは gh release create に作らせる。事前に push すると、後続が失敗したとき
      # release の無いタグだけが残り、次回のベータ番号が無駄に進んでしまう。
      - name: Create GitHub pre-release
        if: ${{ !inputs.repair_existing_release }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BETA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$BETA_VERSION" \
            -f target_commitish=develop \
            --jq .body \
            > release-notes.raw.md
          mise exec python -- python3 scripts/release/sanitize_release_notes.py \
            < release-notes.raw.md \
            > release-notes.md
          gh release create "$BETA_VERSION" \
            --prerelease \
            --notes-file release-notes.md \
            --target develop

      - name: Repair existing GitHub pre-release
        if: ${{ inputs.repair_existing_release }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BETA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$BETA_VERSION" \
            --json body \
            --jq .body \
            > release-notes.raw.md
          mise exec python -- python3 scripts/release/sanitize_release_notes.py \
            < release-notes.raw.md \
            > release-notes.md
          gh release edit "$BETA_VERSION" --notes-file release-notes.md

      - name: Add reaction to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });
