name: Assign author

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auto-author:
    name: Assign author to PR
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      pull-requests: write
    steps:
      # https://github.com/technote-space/assign-author
      - name: Assign author to PR
        uses: toshimaru/auto-author-assign@415448809ea5ba0e171b251632720b009df3d8d6 # v3.1.1
