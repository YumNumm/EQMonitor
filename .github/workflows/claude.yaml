name: Claude Code

on:
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created
  issues:
    types:
      - opened
      - assigned
  pull_request_review:
    types:
      - submitted

jobs:
  claude:
    if: |
      github.actor == 'YumNumm' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - name: Setup application runtime & Resolve dependencies
        uses: ./.github/actions/setup-application-runtime

      # Java 17を明示的に設定
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android License
        run: yes | flutter doctor --android-licenses || true

      - name: Extract keystore
        run: |
          echo '${{ secrets.SIGNING_KEY }}' | base64 -d > app/android/app/key.jks
          echo '${{ secrets.FIREBASE_ANDROID }}' | base64 -d > app/android/app/google-services.json
          echo '${{ secrets.KEY_PROPERTIES }}' | base64 -d  > app/android/key.properties

      - name: Extract Dotenv
        run: |
          echo "${{ secrets.DOTENV }}" | base64 -d > environment.tar.gz
          tar -xzf environment.tar.gz
          rm environment.tar.gz
          ls -l environment/

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@90d189f3abd48655ec3e2c67c552cc23e92d6028 # v1.0.10
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
