name: ActionLint

on:
  push:
   branches:
     - '*'
  pull_request:
    branches:
     - '*'
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  actionlint:
    timeout-minutes: 1
    runs-on: ubuntu-slim
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.1.1
        with:
          install_args: "actionlint"

      - name: Add matcher
        run: |
          echo "::add-matcher::.github/problem_matcher/actionlint.json"

      - name: Run actionlint
        run: |
          actionlint -color

  