name: EQMonitor Map Scene Spike

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android-build:
    name: Android Profile and Release Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # third_party/flutter_scene は pubspec の path 依存なので pub 解決に必須
      - name: Init flutter_scene submodule
        uses: ./.github/actions/init-flutter-scene-submodule

      - name: Install Mise dependencies
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: "flutter java"

      - name: Verify pinned Flutter SDK
        run: mise exec -- flutter --version --machine

      - name: Precache Flutter Android artifacts
        run: mise exec -- flutter precache --android

      - name: Resolve example dependencies
        working-directory: packages/eqmonitor_map/example
        run: mise exec -- flutter pub get --enforce-lockfile

      - name: Analyze eqmonitor_map package
        run: mise exec -- flutter analyze --no-pub --fatal-infos packages/eqmonitor_map

      - name: Build Android profile
        working-directory: packages/eqmonitor_map/example
        run: mise exec -- flutter build apk --profile

      - name: Build Android release
        working-directory: packages/eqmonitor_map/example
        run: mise exec -- flutter build apk --release

  ios-build:
    name: iOS Profile and Release Build
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # third_party/flutter_scene は pubspec の path 依存なので pub 解決に必須
      - name: Init flutter_scene submodule
        uses: ./.github/actions/init-flutter-scene-submodule

      - name: Install Mise dependencies
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: "flutter"

      - name: Verify pinned Flutter SDK
        run: mise exec -- flutter --version --machine

      - name: Precache Flutter iOS artifacts
        run: mise exec -- flutter precache --ios

      - name: Resolve example dependencies
        working-directory: packages/eqmonitor_map/example
        run: mise exec -- flutter pub get --enforce-lockfile

      - name: Build iOS profile
        working-directory: packages/eqmonitor_map/example
        run: mise exec -- flutter build ios --profile --no-codesign

      - name: Build iOS release
        working-directory: packages/eqmonitor_map/example
        run: mise exec -- flutter build ios --release --no-codesign
