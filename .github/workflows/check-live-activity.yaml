name: Live Activity Compatibility
on:
  pull_request:
    paths:
      - "app/ios/**"
      - "tool/live_activity_tests/**"
      - ".github/workflows/check-live-activity.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-activity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    name: iOS Live Activity contract and render tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Compile Widget sources and run simulator tests
        run: tool/live_activity_tests/run.sh
