name: Dart Test

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: 4dacd3fc91d96262a33e5c598e17d816f0b35641
          path: .flutter-scene-sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch base for diff tests
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "$PR_BASE_REF" --depth=1
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            git fetch origin "$MERGE_GROUP_BASE_SHA" --depth=1
          fi

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Verify pinned Flutter SDK
        run: |
          mise bootstrap repos status --missing
          mise exec -- flutter --version --machine

      - name: Precache Flutter Linux artifacts
        run: mise exec -- flutter precache --linux

      - name: Resolve dependencies
        run: mise exec -- dart pub get --enforce-lockfile

      - name: Install melos
        run: |
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          mise exec -- dart pub global activate melos

      - name: Run tests
        id: flutter-test
        run: |
          melos exec \
            --dir-exists=test \
            --concurrency=4 \
            -- mise exec -- flutter test --dart-define=CI=true --file-reporter="json:test_report.log"

      # https://github.com/dorny/test-reporter
      - name: Report test
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Flutter Test"
          path: "(app|packages/**)/test_report.log"
          reporter: "flutter-json"
          fail-on-error: "true"
