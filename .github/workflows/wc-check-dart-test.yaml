name: Dart Test

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch base for diff tests
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "$PR_BASE_REF" --depth=1
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            git fetch origin "$MERGE_GROUP_BASE_SHA" --depth=1
          fi

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: "flutter"

      - name: Resolve dependencies
        run: dart pub get --enforce-lockfile

      - name: Install melos
        run: |
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          dart pub global activate melos

      - name: Run tests
        id: flutter-test
        run: |
          melos exec \
            --dir-exists=test \
            --concurrency=4 \
            -- flutter test --dart-define=CI=true --file-reporter="json:test_report.log"

      # https://github.com/dorny/test-reporter
      - name: Report test
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Flutter Test"
          path: "(app|packages/**)/test_report.log"
          reporter: "flutter-json"
          fail-on-error: "true"
