name: Production Release Tag PR
on:
  push:
    branches:
      - develop

permissions: {}

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - id: tagpr
        uses: Songmu/tagpr@84850af451fc53753c6685a3a6a2af7beef23607 # v1.18.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
