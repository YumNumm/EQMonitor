name: Generate Dart BFF Client

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-openapi:
    name: Generate OpenAPI JSON
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      openapi-json-artifact-id: ${{ steps.upload-openapi-json.outputs.artifact_id }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          working_directory: typescript

      - name: Resolve dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI specification
        working-directory: typescript/bff
        run: pnpm run --silent generate:openapi | tee openapi.json

      # https://github.com/actions/upload-artifact
      - name: Upload OpenAPI JSON as artifact
        id: upload-openapi-json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi.json
          path: typescript/bff/openapi.json
          if-no-files-found: error

  generate-dart-bff-client:
    name: Generate Dart BFF Client
    # FlutterはLinux ARM64をサポートしていないため、Linux AMD64を利用
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    needs:
      - generate-openapi
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        env:
          # See: https://mise.jdx.dev/getting-started.html#github-api-rate-limiting
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install_args: "flutter"
          working_directory: flutter

      - name: Resolve dependencies
        working-directory: flutter/packages/honda_bff_client
        run: dart pub get --enforce-lockfile

      # https://github.com/actions/download-artifact
      - name: Download OpenAPI JSON artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi.json
          path: flutter/packages/honda_bff_client

      - name: Generate Dart BFF Client
        id: generate-dart-bff-client
        working-directory: flutter/packages/honda_bff_client
        run: |
          {
            echo "log<<EOL"
            dart run bin/generate_code.dart -openapiFile "$PWD/openapi.json"
            echo "EOL"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Format generated code
        working-directory: flutter/packages/honda_bff_client
        run: dart format lib/

      - name: Compare generated code against default branch
        id: check_changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cp -r flutter/packages/honda_bff_client/lib /tmp/generated_lib

          git fetch origin "$DEFAULT_BRANCH" --depth=1
          git checkout -f "origin/$DEFAULT_BRANCH"

          rm -rf flutter/packages/honda_bff_client/lib
          cp -r /tmp/generated_lib flutter/packages/honda_bff_client/lib

          echo "::group::git status"
          git status --porcelain -- flutter/packages/honda_bff_client/lib/
          echo "::endgroup::"

          has_changes=$([[ -n "$(git status --porcelain -- flutter/packages/honda_bff_client/lib/)" ]] && echo true || echo false)
          echo "has_changes=$has_changes"
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

      # https://github.com/peter-evans/create-pull-request
      - name: Create PR for regenerate Dart BFF client
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.check_changes.outputs.has_changes == 'true'
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          draft: true
          add-paths: "flutter/packages/honda_bff_client/lib/**/*"
          signoff: true
          sign-commits: true
          commit-message: "chore: regenerate Dart BFF client"
          committer: "GitHub Actions <noreply@github.com>"
          branch: "regenerate-dart-bff-client/patch"
          labels: "Auto Update"
          reviewers: ${{ github.actor }}
          title: "Regenerate Dart BFF client"
          body: |
            Regenerate Dart BFF client by GitHub Actions
            by: ${{github.actor}}

            <details>
            <summary><h2>📝 Generate Dart BFF Client Log</h2></summary>

            ```log
            ${{ steps.generate-dart-bff-client.outputs.log }}
            ```
            </details>
