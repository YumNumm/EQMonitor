name: Deploy App

on:
  push:
    branches:
      - develop
    tags:
      - "v*-beta.*"
  workflow_dispatch:
    inputs:
      ios:
        description: "Build iOS app"
        required: false
        default: true
        type: boolean
      android:
        description: "Build Android app"
        required: false
        default: true
        type: boolean
      external:
        description: "Distribute iOS build to TestFlight external group"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  XCODE_VERSION: 26.6
  GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER: projects/179553945248/locations/global/workloadIdentityPools/github-actions-identity-pool/providers/github-actions-identity-provider
  GOOGLE_CLOUD_SERVICE_ACCOUNT: actions-eqmonitor-appdistro@eqmonitor-main.iam.gserviceaccount.com

jobs:
  define-matrix:
    name: Define Matrix
    runs-on: ubuntu-slim
    permissions:
      contents: read
    timeout-minutes: 1
    outputs:
      deploy-ios: ${{ steps.define-environment-matrix.outputs.deploy-ios }}
      deploy-android: ${{ steps.define-environment-matrix.outputs.deploy-android }}
      deploy-ios-external: ${{ steps.define-environment-matrix.outputs.deploy-ios-external }}
      android-track: ${{ steps.define-environment-matrix.outputs.android-track }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide which app to deploy
        id: define-environment-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          INPUT_IOS: ${{ inputs.ios || false }}
          INPUT_ANDROID: ${{ inputs.android || false }}
          INPUT_EXTERNAL: ${{ inputs.external || false }}
        run: scripts/ci/resolve_deploy_app_policy.sh >> "$GITHUB_OUTPUT"

  build-ios:
    name: Build iOS
    needs: define-matrix
    if: ${{ needs.define-matrix.outputs.deploy-ios }}
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: 4dacd3fc91d96262a33e5c598e17d816f0b35641
          path: .flutter-scene-sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: "xcbeautify"

      - name: Verify pinned Flutter SDK
        run: |
          mise bootstrap repos status --missing
          mise exec -- flutter --version --machine

      - name: Precache Flutter iOS artifacts
        run: mise exec -- flutter precache --ios

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      # https://github.com/maxim-lobanov/setup-xcode
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Enable Swift Package Manager
        run: |
          mise exec -- flutter config --enable-swift-package-manager

      - name: Resolve dependencies
        working-directory: app
        run: mise exec -- flutter pub get --enforce-lockfile

      # AppIntent/Widget Bundle Resources need a slim jma_code_table.json.
      # Full parameters stay on Managed Background Assets at runtime.
      - name: Generate GitHub App token (eqmonitor-backend contents:read)
        id: asset-pack-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.EQMONITOR_GITHUB_APP_ID }}
          private-key: ${{ secrets.EQMONITOR_GITHUB_APP_PRIVATE_KEY }}
          owner: YumNumm
          repositories: |
            eqmonitor-backend
          permission-contents: read

      - name: Stage iOS native jma_code_table from backend Release
        env:
          GH_TOKEN: ${{ steps.asset-pack-token.outputs.token }}
        run: tool/asset_pack/stage_from_release.sh --target ios-native

      - name: Extract environment variables
        run: |
          echo "$DART_DEFINE_PRODUCTION" | base64 -d > environment/.env.prod

      - name: Configure iOS
        working-directory: app
        env:
          COMMIT_INFORMATION: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")
          mise exec -- flutter build ios --config-only \
            --no-codesign \
            --no-pub \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=../environment/.env.prod \
            --dart-define COMMIT_INFORMATION="$COMMIT_INFORMATION" \
            --dart-define BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            --dart-define BUILD_COMMIT_MESSAGE="$BUILD_COMMIT_MESSAGE" \
            --dart-define IS_BETA_TESTING="true"

      - name: Extract App Store Connect API Key
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d \
            > "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      # Cloud-managed certificates: アーカイブ時は署名しない。
      # 証明書・プロビジョニングプロファイルはエクスポート時に API Key 経由で自動管理される。
      # 参考: https://zenn.dev/welchi/articles/flutter-ios-ci-cd-xcode-cloud
      - name: Create XCArchive
        working-directory: app
        run: |
          # Without pipefail, xcodebuild failures are swallowed by xcbeautify
          # and the job only fails later when Runner.app is missing.
          # The pipeline must stay inside `if`, otherwise `bash -e` aborts the
          # step before the raw log can be dumped.
          set -o pipefail
          if ! xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            VERBOSE_SCRIPT_LOGGING=YES \
            2>&1 | tee /tmp/xcodebuild-archive.log | xcbeautify --renderer github-actions; then
            # xcbeautify drops actool/ibtoold and Run Script diagnostics,
            # so surface them explicitly.
            echo "::group::xcodebuild raw errors"
            grep -n -A 5 -E '^(error:|.*\*\* ARCHIVE FAILED)' /tmp/xcodebuild-archive.log || true
            echo "::endgroup::"
            echo "::group::Run Script phase output"
            # A failing PhaseScriptExecution prints its stdout/stderr right after
            # the command header; `tail` alone is swallowed by trailing Copy logs.
            awk '/^PhaseScriptExecution/{start = NR} {line[NR] = $0}
                 END {if (start) for (i = start; i <= NR && i < start + 500; i++) print line[i]}' \
              /tmp/xcodebuild-archive.log
            echo "::endgroup::"
            echo "::group::Sandbox / script failures"
            grep -n -E 'Sandbox: |deny\(1\)|Command PhaseScriptExecution failed' \
              /tmp/xcodebuild-archive.log || true
            echo "::endgroup::"
            echo "::error::xcodebuild archive failed. See raw log artifact."
            exit 1
          fi

      - name: Upload xcodebuild raw log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-archive-log
          path: /tmp/xcodebuild-archive.log
          retention-days: 7

      # 埋め込みフレームワークとアプリを ad-hoc 署名。export 時に Distribution 証明書で上書きされる。
      - name: Embed entitlements and ad-hoc sign
        working-directory: app
        run: |
          ../scripts/ci/sign_ios_archive_for_export.sh \
            --app build/ios/Runner.xcarchive/Products/Applications/Runner.app \
            --ios-dir ios

      # エクスポート時に App Store Connect API Key で Cloud-managed 署名（証明書はクラウドで管理）
      - name: Create IPA
        working-directory: app
        run: |
          set -o pipefail
          KEY_PATH="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath . \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyPath "$KEY_PATH" \
          | xcbeautify --renderer github-actions
          echo "--------------------------------"
          ls -lah .

      # Firebase App Distribution 用に ad-hoc(release-testing) 署名の IPA も同じアーカイブから生成。
      # -allowProvisioningUpdates により Apple Developer 登録済み端末を含む ad-hoc プロファイルが自動生成される。
      - name: Create Ad-Hoc IPA
        working-directory: app
        run: |
          set -o pipefail
          KEY_PATH="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptionsAdHoc.plist \
            -exportPath adhoc \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyPath "$KEY_PATH" \
          | xcbeautify --renderer github-actions
          echo "--------------------------------"
          ls -lah adhoc

      # https://github.com/actions/upload-artifact
      - name: Upload ipa as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EQMonitor-ios.ipa
          path: app/EQMonitor.ipa
          if-no-files-found: error

      # https://github.com/actions/upload-artifact
      - name: Upload ad-hoc ipa as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EQMonitor-ios-adhoc.ipa
          path: app/adhoc/EQMonitor.ipa
          if-no-files-found: error

  deploy-ios:
    name: Deploy iOS (App Store Connect)
    needs:
      - build-ios
      - define-matrix
    runs-on: macos-26
    permissions:
      contents: read
    environment:
      name: EQMonitor-iOS
    timeout-minutes: 60
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # https://github.com/actions/download-artifact
      - name: Download ipa
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EQMonitor-ios.ipa
          path: build

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          cache: false
          install_args: '"github:rorkai/App-Store-Connect-CLI"'

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Publish to TestFlight
        env:
          ASC_APP_ID: "6447546703"
          ASC_BETA_GROUP_ID: bd75f066-fd92-4175-b2d6-f34952737557
          ASC_BYPASS_KEYCHAIN: "1"
          DEPLOY_IOS_EXTERNAL: ${{ needs.define-matrix.outputs.deploy-ios-external }}
        run: |
          export ASC_KEY_ID="$APP_STORE_CONNECT_API_KEY_ID"
          export ASC_ISSUER_ID="$APP_STORE_CONNECT_API_ISSUER_ID"
          export ASC_PRIVATE_KEY_B64="$APP_STORE_CONNECT_API_KEY_BASE64"
          # ビルド番号は asc が IPA の Info.plist から自動抽出するため、
          # 旧実装のような unzip / PlistBuddy での照会は不要。
          args=(--app "$ASC_APP_ID" --ipa build/EQMonitor.ipa --output json)
          if [ "$DEPLOY_IOS_EXTERNAL" = "true" ]; then
            TEST_NOTES="$(scripts/ci/testflight_test_notes.sh)"
            args+=(
              --group "$ASC_BETA_GROUP_ID"
              --test-notes "$TEST_NOTES"
              --locale ja
              --wait
              --submit --confirm
              --timeout 30m
            )
          fi
          asc publish testflight "${args[@]}"

  deploy-ios-firebase-app-distribution:
    name: Deploy iOS (Firebase App Distribution)
    needs:
      - build-ios
      - define-matrix
    # firebase-tools は linux-arm64 バイナリを配布しておらず arm ランナー不可のため x64 を使う
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: EQMonitor-iOS
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: "firebase yq"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Download artifact ipa
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EQMonitor-ios-adhoc.ipa
          path: build

      - name: List files & rename
        run: |
          ls -lah build/
          mv build/*.ipa build/app.ipa
          echo "--------------------------------"
          ls -lah build/

      - name: Output release version
        run: |
          VERSION=$(yq .version app/pubspec.yaml -r)
          REF_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "[$VERSION - $REF_NAME]" > changelog.tmp

      - name: Output git log
        run: |
          # LAST TAG
           LAST_TAG=$(git describe --tags --abbrev=0)
           git log "${LAST_TAG}..HEAD" --pretty=format:"- [%ad] %an: %s %h" >> changelog.tmp

           # 最大2000文字
           head -c 2000 changelog.tmp > changelog.txt
           if [ "$(wc -c < changelog.txt)" -gt 2000 ]; then
             echo '...' >> changelog.txt
           fi

      # https://github.com/google-github-actions/auth
      - name: Authenticate to Google Cloud Platform
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_CLOUD_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: 1:179553945248:ios:a738f33a18702c7f6fabc5
        run: |
          firebase appdistribution:distribute \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file "changelog.txt" \
            --groups "main" \
            build/app.ipa

  build-android:
    name: Build Android
    needs: define-matrix
    if: ${{ needs.define-matrix.outputs.deploy-android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: 4dacd3fc91d96262a33e5c598e17d816f0b35641
          path: .flutter-scene-sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: "java uv python pipx:codemagic-cli-tools"

      - name: Verify pinned Flutter SDK
        run: |
          mise bootstrap repos status --missing
          mise exec -- flutter --version --machine

      - name: Precache Flutter Android artifacts
        run: mise exec -- flutter precache --android

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Accept Android License
        run: yes | mise exec -- flutter doctor --android-licenses

      - name: Resolve dependencies
        working-directory: app
        run: mise exec -- flutter pub get --enforce-lockfile

      # Play Asset Delivery install-time pack contents are not committed.
      # Stage the latest asset-pack-v* Release from eqmonitor-backend into the
      # Gradle module before building the AAB (see docs/asset-pack-cd.md).
      - name: Generate GitHub App token (eqmonitor-backend contents:read)
        id: asset-pack-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.EQMONITOR_GITHUB_APP_ID }}
          private-key: ${{ secrets.EQMONITOR_GITHUB_APP_PRIVATE_KEY }}
          owner: YumNumm
          repositories: |
            eqmonitor-backend
          permission-contents: read

      - name: Stage Android Asset Pack from backend Release
        env:
          GH_TOKEN: ${{ steps.asset-pack-token.outputs.token }}
        run: tool/asset_pack/stage_from_release.sh --target android

      - name: Extract keystore
        run: |
          echo "$SIGNING_KEY" | base64 -d > app/android/app/key.jks
          echo "$KEY_PROPERTIES" | base64 -d  > app/android/key.properties

          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Build Number set to ${BUILD_NUMBER}."

      - name: Extract environment variables
        run: |
          echo "$DART_DEFINE_PRODUCTION" | base64 -d > environment/.env.prod

      - name: Copy gradle.properties
        working-directory: app/android
        run: |
          cp gradle.ci.properties gradle.properties

      - name: Build Android (AAB)
        working-directory: app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_INFORMATION: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")
          mise exec -- flutter build appbundle \
            --release \
            --no-pub \
            --build-number="${BUILD_NUMBER}" \
            --dart-define-from-file=../environment/.env.prod \
            --dart-define COMMIT_INFORMATION="$COMMIT_INFORMATION" \
            --dart-define BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            --dart-define BUILD_COMMIT_MESSAGE="$BUILD_COMMIT_MESSAGE" \
            --dart-define IS_BETA_TESTING="true"

      - name: Copy AAB to expected location
        run: |
          mkdir -p app/build/app/outputs/bundle/release
          find app/android/app -name "app-release.aab" -type f -exec cp {} app/build/app/outputs/bundle/release/app-release.aab \;
          ls -lh app/build/app/outputs/bundle/release/

      - name: Upload aab as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EQMonitor-android.aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  deploy-android-firebase-app-distribution:
    name: Deploy Android (Firebase App Distribution)
    needs: build-android
    # firebase-tools は linux-arm64 バイナリを配布しておらず、aqua registry の
    # supported_envs も amd64 のみ。arm ランナーでは mise --locked が失敗するため x64 を使う
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: EQMonitor-Android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: "firebase yq"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Download artifact aab
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EQMonitor-android.aab
          path: build

      - name: List files & rename
        run: |
          ls -lah build/
          mv build/*.aab build/app.aab
          echo "--------------------------------"
          ls -lah build/

      - name: Output release version
        run: |
          VERSION=$(yq .version app/pubspec.yaml -r)
          REF_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "[$VERSION - $REF_NAME]" > changelog.tmp

      - name: Output git log
        run: |
          # LAST TAG
           LAST_TAG=$(git describe --tags --abbrev=0)
           git log "${LAST_TAG}..HEAD" --pretty=format:"- [%ad] %an: %s %h" >> changelog.tmp

           # 最大2000文字
           head -c 2000 changelog.tmp > changelog.txt
           if [ "$(wc -c < changelog.txt)" -gt 2000 ]; then
             echo '...' >> changelog.txt
           fi

      # https://github.com/google-github-actions/auth
      - name: Authenticate to Google Cloud Platform
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_CLOUD_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: 1:179553945248:android:11ffcfb483c098ad6fabc5
        run: |
          firebase appdistribution:distribute \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file "changelog.txt" \
            --groups "main" \
            build/app.aab

  deploy-android-google-play:
    name: Deploy Android (Google Play)
    needs:
      - build-android
      - define-matrix
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: EQMonitor-Android
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # https://github.com/actions/download-artifact
      - name: Download AAB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EQMonitor-android.aab
          path: download

      - name: Move AAB to root
        run: mv download/*.aab app.aab

      - name: Show AAB size
        run: |
          ls -lh app.aab
          du -sh app.aab

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: "github:YumNumm/google-play-cli yq"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Output release version
        id: output_release_version
        run: |
          VERSION=$(yq .version app/pubspec.yaml -r)
          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "[$VERSION]" > changelog.tmp

      - name: Output git log
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null) || LAST_TAG=$(git rev-list --max-parents=0 HEAD)
          git log "${LAST_TAG}..HEAD" --pretty=format:"- [%ad] %an: %s %h" >> changelog.tmp

          # Google Play API は言語ごとに最大500文字（Unicode）。バイト単位の head では超過し得るため文字数で切る
          python3 << 'PY'
          from pathlib import Path

          text = Path("changelog.tmp").read_text(encoding="utf-8")
          max_len = 500
          if len(text) > max_len:
              text = text[: max_len - 3] + "..."
          Path("changelog.txt").write_text(text, encoding="utf-8")
          print(f"release notes length (chars): {len(text)}")
          PY

      - name: Generate release notes JSON
        run: |
          jq -Rs '[{language: "ja-JP", text: .}]' changelog.txt > release-notes.json
          jq . release-notes.json

      # https://github.com/google-github-actions/auth
      - name: Authenticate to Google Cloud Platform
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: actions-eqmonitor-appdistro@eqmonitor-main.iam.gserviceaccount.com
          token_format: access_token

      - name: Ensure Google Play track exists
        if: ${{ needs.define-matrix.outputs.android-track == 'external' }}
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: net.yumnumm.eqmonitor
          TRACK_NAME: ${{ needs.define-matrix.outputs.android-track }}
        run: scripts/release/ensure_google_play_track.sh

      - name: Upload AAB to Google Play
        env:
          RELEASE_NAME: ${{ steps.output_release_version.outputs.release_version }}
          GOOGLE_PLAY_TRACK: ${{ needs.define-matrix.outputs.android-track }}
        run: |
          google-play-cli bundles publish \
            --bundle app.aab \
            --track "$GOOGLE_PLAY_TRACK" \
            --release-notes="$(cat release-notes.json)" \
            --release-name "$RELEASE_NAME" \
            --package-name "net.yumnumm.eqmonitor"
