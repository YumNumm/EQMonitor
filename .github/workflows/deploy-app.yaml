name: Deploy App

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      ios:
        description: "Build iOS app"
        required: false
        default: true
        type: boolean
      android:
        description: "Build Android app"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  XCODE_VERSION: 26.3
  GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER: projects/179553945248/locations/global/workloadIdentityPools/github-actions-identity-pool/providers/github-actions-identity-provider
  GOOGLE_CLOUD_SERVICE_ACCOUNT: actions-eqmonitor-appdistro@eqmonitor-main.iam.gserviceaccount.com

jobs:
  define-matrix:
    name: Define Matrix
    runs-on: ubuntu-slim
    timeout-minutes: 1
    outputs:
      deploy-ios: ${{ steps.define-environment-matrix.outputs.deploy-ios }}
      deploy-android: ${{ steps.define-environment-matrix.outputs.deploy-android }}
    steps:
      - name: Decide which app to deploy
        id: define-environment-matrix
        run: |
          platforms=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.ios }}" = "true" ]; then
              platforms+=("ios")
            fi
            if [ "${{ inputs.android }}" = "true" ]; then
              platforms+=("android")
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
              # [release only] タグがない場合は全プラットフォームをデプロイ
              echo "commit message does not contain [release only platform], deploy all platforms"
              platforms+=("ios" "android")
          else
            echo "Unknown event name: ${{ github.event_name }}"
            exit 1
          fi

          echo "デプロイするプラットフォーム: ${platforms[*]}"
          for platform in "${platforms[@]}"; do
            echo "deploy-${platform}=true" >> "$GITHUB_OUTPUT"
          done

  build-ios:
    name: Build iOS
    needs: define-matrix
    if: ${{ needs.define-matrix.outputs.deploy-ios }}
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-android
      cancel-in-progress: false
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: "flutter xcbeautify"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      # https://github.com/maxim-lobanov/setup-xcode
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Enable Swift Package Manager
        run: |
          flutter config --enable-swift-package-manager

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Extract environment variables
        run: |
          echo "$DART_DEFINE_PRODUCTION" | base64 -d > environment/.env.prod

      - name: Configure iOS
        working-directory: app
        env:
          COMMIT_INFORMATION: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          flutter build ios --config-only \
            --no-codesign \
            --no-pub \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=../environment/.env.prod \
            --dart-define COMMIT_INFORMATION=$COMMIT_INFORMATION

      - name: Extract App Store Connect API Key
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d \
            > "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      # Cloud-managed certificates: アーカイブ時は署名しない。
      # 証明書・プロビジョニングプロファイルはエクスポート時に API Key 経由で自動管理される。
      # 参考: https://zenn.dev/welchi/articles/flutter-ios-ci-cd-xcode-cloud
      - name: Create XCArchive
        working-directory: app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify --renderer github-actions

      # 埋め込みフレームワークとアプリを ad-hoc 署名。export 時に Distribution 証明書で上書きされる。
      - name: Embed entitlements and ad-hoc sign
        working-directory: app
        run: |
          ARCHIVE_APP="build/ios/Runner.xcarchive/Products/Applications/Runner.app"
          # 埋め込み .framework を先に ad-hoc 署名（ネストは深い方から）
          find "$ARCHIVE_APP" -name "*.framework" -type d | while read -r fw; do
            codesign --force --sign "-" "$fw"
          done
          # メインアプリに entitlements を埋めて ad-hoc 署名
          codesign \
            --entitlements ios/Runner/Runner.entitlements \
            --force \
            --sign "-" "$ARCHIVE_APP"

      # エクスポート時に App Store Connect API Key で Cloud-managed 署名（証明書はクラウドで管理）
      - name: Create IPA
        working-directory: app
        run: |
          KEY_PATH="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath . \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyPath "$KEY_PATH" \
          | xcbeautify --renderer github-actions
          echo "--------------------------------"
          ls -lah .

      # https://github.com/actions/upload-artifact
      - name: Upload ipa as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EQMonitor-ios.ipa
          path: app/EQMonitor.ipa
          if-no-files-found: error

  deploy-ios:
    name: Deploy iOS
    needs: build-ios
    runs-on: macos-26
    environment:
      name: EQMonitor-iOS
    concurrency:
      group: ${{ github.workflow }}-ios
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # https://github.com/maxim-lobanov/setup-xcode
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show Xcode version
        run: xcodebuild -version

      # https://github.com/actions/download-artifact
      - name: Download ipa
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EQMonitor-ios.ipa
          path: build

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: "xcbeautify yq"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Output release version
        run: |
          VERSION=$(yq .version app/pubspec.yaml -r)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          REF_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "[$VERSION - $REF_NAME]" > changelog.tmp

      - name: Output git log
        run: |
          APPLE_ID="${APP_APPLE_ID_FROM_SECRET:-$APP_STORE_CONNECT_APP_APPLE_ID}"
          if [ -z "$APPLE_ID" ]; then
            echo "::error::App Store Connect のアプリ Apple ID（数値）を設定してください: GitHub Secret APP_STORE_CONNECT_APP_APPLE_ID、または mise の APP_STORE_CONNECT_APP_APPLE_ID"
            exit 1
          fi
          echo "APPLE_ID=${APPLE_ID}" >> "$GITHUB_ENV"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null) || LAST_TAG=$(git rev-list --max-parents=0 HEAD)
          git log "${LAST_TAG}..HEAD" --pretty=format:"- [%ad] %an: %s %h" >> changelog.tmp

          # Android Firebase デプロイと同様（最大2000文字）
          head -c 2000 changelog.tmp > changelog.txt
          if [ "$(wc -c < changelog.tmp)" -gt 2000 ]; then
            echo '...' >> changelog.txt
          fi

          # altool の beta テキストは "whatsNew" = "..."; 形式（README 参照）。日本語は ja.txt。
          BETA_TEXT_DIR="build/beta-app-store-text/beta-${APPLE_ID}/upload/IOS"
          mkdir -p "$BETA_TEXT_DIR"
          export BETA_TEXT_DIR
          python3 << 'PY'
          import os
          import pathlib

          root = pathlib.Path(os.environ["BETA_TEXT_DIR"])
          changelog = pathlib.Path("changelog.txt").read_text(encoding="utf-8")
          if len(changelog) > 4000:
              changelog = changelog[:3997] + "\n…"
          c = changelog.replace("\\", "\\\\").replace('"', '\\"')
          (root / "ja.txt").write_text('"whatsNew" = "' + c + '";\n', encoding="utf-8")
          PY

      - name: Extract App Store Connect API Key
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d \
            > "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Upload Ipa to App Store Connect
        run: |
          xcrun altool \
            --upload-app \
            -f build/EQMonitor.ipa \
            --type ios \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID"

      - name: Upload Beta App Store text (TestFlight)
        run: |
          xcrun altool \
            --beta-app-store-text build/beta-app-store-text \
            --upload \
            --apple-id "$APPLE_ID" \
            --bundle-short-version-string "$VERSION" \
            --bundle-version "${{ github.run_number }}" \
            --platform ios \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID"

  build-android:
    name: Build Android
    needs: define-matrix
    if: ${{ needs.define-matrix.outputs.deploy-android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: "flutter java uv python pipx:codemagic-cli-tools"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Accept Android License
        run: yes | flutter doctor --android-licenses

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Extract keystore
        run: |
          echo "$SIGNING_KEY" | base64 -d > app/android/app/key.jks
          echo "$KEY_PROPERTIES" | base64 -d  > app/android/key.properties

          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Build Number set to ${BUILD_NUMBER}."

      - name: Extract environment variables
        run: |
          echo "$DART_DEFINE_PRODUCTION" | base64 -d > environment/.env.prod

      - name: Copy gradle.properties
        working-directory: app/android
        run: |
          cp gradle.ci.properties gradle.properties

      - name: Build Android (AAB)
        working-directory: app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build appbundle \
            --release \
            --no-pub \
            --build-number="${BUILD_NUMBER}" \
            --dart-define-from-file=../environment/.env.prod

      - name: Copy AAB to expected location
        run: |
          mkdir -p app/build/app/outputs/bundle/release
          find app/android/app -name "app-release.aab" -type f -exec cp {} app/build/app/outputs/bundle/release/app-release.aab \;
          ls -lh app/build/app/outputs/bundle/release/

      - name: Upload aab as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EQMonitor-android.aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  deploy-android-firebase-app-distribution:
    name: Deploy Android (Firebase App Distribution)
    needs: build-android
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: EQMonitor-Android
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: "firebase yq"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Download artifact aab
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EQMonitor-android.aab
          path: build

      - name: List files & rename
        run: |
          ls -lah build/
          mv build/*.aab build/app.aab
          echo "--------------------------------"
          ls -lah build/

      - name: Output release version
        run: |
          VERSION=$(yq .version app/pubspec.yaml -r)
          REF_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "[$VERSION - $REF_NAME]" > changelog.tmp

      - name: Output git log
        run: |
          # LAST TAG
           LAST_TAG=$(git describe --tags --abbrev=0)
           git log "${LAST_TAG}..HEAD" --pretty=format:"- [%ad] %an: %s %h" >> changelog.tmp

           # 最大2000文字
           head -c 2000 changelog.tmp > changelog.txt
           if [ "$(wc -c < changelog.txt)" -gt 2000 ]; then
             echo '...' >> changelog.txt
           fi

      # https://github.com/google-github-actions/auth
      - name: Authenticate to Google Cloud Platform
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_CLOUD_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: 1:179553945248:android:11ffcfb483c098ad6fabc5
        run: |
          firebase appdistribution:distribute \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file "changelog.txt" \
            --groups "main" \
            build/app.aab

  deploy-android-google-play:
    name: Deploy Android (Google Play)
    needs: build-android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-android-google-play
    permissions:
      contents: read
      id-token: write
    environment:
      name: EQMonitor-Android
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # https://github.com/actions/download-artifact
      - name: Download AAB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EQMonitor-android.aab
          path: download

      - name: Move AAB to root
        run: mv download/*.aab app.aab

      - name: Show AAB size
        run: |
          ls -lh app.aab
          du -sh app.aab

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: "github:YumNumm/google-play-cli yq"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Output release version
        id: output_release_version
        run: |
          VERSION=$(yq .version app/pubspec.yaml -r)
          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "[$VERSION]" > changelog.tmp

      - name: Output git log
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null) || LAST_TAG=$(git rev-list --max-parents=0 HEAD)
          git log "${LAST_TAG}..HEAD" --pretty=format:"- [%ad] %an: %s %h" >> changelog.tmp

          # Google Play のリリースノートは言語あたり最大500文字
          head -c 500 changelog.tmp > changelog.txt
          if [ "$(wc -c < changelog.tmp)" -gt 500 ]; then
            echo '...' >> changelog.txt
          fi

      - name: Generate release notes JSON
        run: |
          jq -Rs '[{language: "ja-JP", text: .}]' changelog.txt > release-notes.json
          jq . release-notes.json

      # https://github.com/google-github-actions/auth
      - name: Authenticate to Google Cloud Platform
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: actions-eqmonitor-appdistro@eqmonitor-main.iam.gserviceaccount.com

      - name: Upload AAB to Google Play
        env:
          RELEASE_NAME: ${{ steps.output_release_version.outputs.release_version }}
        run: |
          google-play-cli bundles publish \
            --bundle app.aab \
            --track "internal" \
            --release-notes="$(cat release-notes.json)" \
            --release-name "$RELEASE_NAME" \
            --package-name "net.yumnumm.eqmonitor"
