name: Deploy App

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      ios:
        description: "Build iOS app"
        required: false
        default: true
        type: boolean
      android:
        description: "Build Android app"
        required: false
        default: true
        type: boolean

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  XCODE_VERSION: 26.2
  GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER: projects/179553945248/locations/global/workloadIdentityPools/github-actions-identity-pool/providers/github-actions-identity-provider
  GOOGLE_CLOUD_SERVICE_ACCOUNT: actions-eqmonitor-appdistro@eqmonitor-main.iam.gserviceaccount.com

jobs:
  define-matrix:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    outputs:
      deploy-ios: ${{ steps.define-environment-matrix.outputs.deploy-ios }}
      deploy-android: ${{ steps.define-environment-matrix.outputs.deploy-android }}
    steps:
      - name: Decide which app to deploy
        id: define-environment-matrix
        run: |
          platforms=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.ios }}" = "true" ]; then
              platforms+=("ios")
            fi
            if [ "${{ inputs.android }}" = "true" ]; then
              platforms+=("android")
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
              # [release only] タグがない場合は全プラットフォームをデプロイ
              echo "commit message does not contain [release only platform], deploy all platforms"
              platforms+=("ios" "android")
          else
            echo "Unknown event name: ${{ github.event_name }}"
            exit 1
          fi

          echo "デプロイするプラットフォーム: ${platforms[*]}"
          for platform in "${platforms[@]}"; do
            echo "deploy-${platform}=true" >> "$GITHUB_OUTPUT"
          done

  build-ios:
    needs: define-matrix
    if: ${{ needs.define-matrix.outputs.deploy-ios }}
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-android
      cancel-in-progress: false
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@e79ddf65a11cec7b0e882bedced08d6e976efb2d # v3.1.1
        with:
          install_args: "flutter xcbeautify"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      # https://github.com/maxim-lobanov/setup-xcode
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Enable Swift Package Manager
        run: |
          flutter config --enable-swift-package-manager

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Extract environment variables
        run: |
          echo "$DART_DEFINE_PRODUCTION" | base64 -d > environment/.env.prod

      - name: Configure iOS
        working-directory: app
        run: |
          flutter build ios --config-only \
            --no-codesign \
            --no-pub \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=../environment/.env.prod \
            --dart-define COMMIT_INFORMATION=${{ github.ref_name }}-${{ github.sha }}

      - name: Extract App Store Connect API Key
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d \
            > "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Create XCArchive
        working-directory: app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=CPL7H8SHVM \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8" \
          | xcbeautify --renderer github-actions

      - name: Create IPA
        working-directory: app
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath . \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8" \
          | xcbeautify --renderer github-actions
          echo "--------------------------------"
          ls -lah .

      # https://github.com/actions/upload-artifact
      - name: Upload ipa as artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: EQMonitor-ios.ipa
          path: app/EQMonitor.ipa
          if-no-files-found: error

  deploy-ios:
    needs: build-ios
    runs-on: macos-26
    environment:
      name: EQMonitor-iOS
    concurrency:
      group: ${{ github.workflow }}-ios
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # https://github.com/maxim-lobanov/setup-xcode
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show Xcode version
        run: xcodebuild -version

      # https://github.com/actions/download-artifact
      - name: Download ipa
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: EQMonitor-ios.ipa
          path: build

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@e79ddf65a11cec7b0e882bedced08d6e976efb2d # v3.1.1
        with:
          install_args: "xcbeautify"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Extract App Store Connect API Key
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d \
            > "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Upload Ipa to App Store Connect
        run: |
          xcrun altool \
            --upload-app \
            -f build/eqmonitor.ipa \
            --type ios \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID"

  build-android:
    needs: define-matrix
    if: ${{ needs.define-matrix.outputs.deploy-android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@e79ddf65a11cec7b0e882bedced08d6e976efb2d # v3.1.1
        with:
          install_args: "flutter java uv python pipx:codemagic-cli-tools"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Accept Android License
        run: yes | flutter doctor --android-licenses

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Extract keystore
        run: |
          echo "$SIGNING_KEY" | base64 -d > app/android/app/key.jks
          echo "$KEY_PROPERTIES" | base64 -d  > app/android/key.properties

          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Build Number set to ${BUILD_NUMBER}."

      - name: Extract environment variables
        run: |
          echo "$DART_DEFINE_PRODUCTION" | base64 -d > environment/.env.prod

      - name: Copy gradle.properties
        working-directory: app/android
        run: |
          cp gradle.ci.properties gradle.properties

      - name: Build Android (AAB)
        working-directory: app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build appbundle \
            --release \
            --no-pub \
            --build-number="${BUILD_NUMBER}" \
            --dart-define-from-file=../environment/.env.prod

      - name: Copy AAB to expected location
        run: |
          mkdir -p app/build/app/outputs/bundle/release
          find app/android/app -name "app-release.aab" -type f -exec cp {} app/build/app/outputs/bundle/release/app-release.aab \;
          ls -lh app/build/app/outputs/bundle/release/

      - name: Upload aab as artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: EQMonitor-android.aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  deploy-android:
    needs: build-android
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: EQMonitor-Android
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Extract SOPS Age Key File
        run: |
          echo "${{ secrets.AGE_KEY }}" > .config/age/age.txt

      - name: Copy mise.local.toml
        run: |
          cp mise.local.toml.example mise.local.toml

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@e79ddf65a11cec7b0e882bedced08d6e976efb2d # v3.1.1
        with:
          install_args: "firebase yq"

      - name: Set environment variables
        run: |
          for line in $(mise env --redacted --dotenv); do
            echo "$line" >> "$GITHUB_ENV"
            mask_value="${line#*=}"
            echo "::add-mask::${mask_value}"
          done

      - name: Download artifact aab
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: EQMonitor-android.aab
          path: build

      - name: List files & rename
        run: |
          ls -lah build/
          mv build/*.aab build/app.aab
          echo "--------------------------------"
          ls -lah build/

      - name: Output release version
        run: |
          VERSION=$(yq .version app/pubspec.yaml -r)
          REF_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "[$VERSION - $REF_NAME]" > changelog.tmp

      - name: Output git log
        run: |
          # LAST TAG
           LAST_TAG=$(git describe --tags --abbrev=0)
           git log "${LAST_TAG}..HEAD" --pretty=format:"- [%ad] %an: %s %h" >> changelog.tmp

           # 最大2000文字
           head -c 2000 changelog.tmp > changelog.txt
           if [ "$(wc -c < changelog.txt)" -gt 2000 ]; then
             echo '...' >> changelog.txt
           fi

      # https://github.com/google-github-actions/auth
      - name: Authenticate to Google Cloud Platform
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_CLOUD_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: 1:179553945248:android:11ffcfb483c098ad6fabc5
        run: |
          firebase appdistribution:distribute \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file "changelog.txt" \
            --groups "main" \
            build/app.aab
