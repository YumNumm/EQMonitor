name: eqmonitor_workspace
description: The workspace for the EQMonitor project.

environment:
  sdk: ^3.6.1

workspace:
    - app
    - packages/_base
    - packages/eqapi_client
    - packages/eqapi_types
    - packages/eqmonitor_lints
    - packages/extensions
    - packages/jma_code_table_converter_internal
    - packages/jma_code_table_types
    - packages/jma_map
    - packages/jma_parameter_api_client
    - packages/jma_parameter_converter_internal
    - packages/jma_parameter_types
    - packages/kyoshin_observation_point_converter_internal
    - packages/kyoshin_observation_point_types
    - packages/lat_lng
    - packages/notification_setting_types

dependencies:
  melos: ^7.0.0-dev.2

dependency_overrides:
  file: ^7.0.1

melos:
  repository: https://github.com/YumNumm/EQMonitor
  sdkPath: .fvm/flutter_sdk/

  command:
    version:
      linkToCommits: true
    bootstrap:
      runPubGetInParallel: false
      environment:
        sdk: ^3.6.1
        flutter: ^3.27.2

  scripts:
    analyze:
      run: |
        melos exec -c 1 -- \
          dart analyze . --fatal-infos
      description: |
        Run `dart analyze` in all packages.
        - Note: you can also rely on your IDEs Dart Analysis / Issues window.

    generate:
      run: melos run generate:dart && melos run generate:flutter
      description: Build all generated files for Dart & Flutter packages in this project.

    rebuild:
      run: melos exec -c 1 --depends-on="build_runner" -- "flutter pub run build_runner build --delete-conflicting-outputs"
      description: Build all generated files for Flutter packages in this project.

    clean-all:
      run: melos clean &&  melos exec "flutter clean"

    upgrade:
      run: melos exec "flutter pub upgrade --major-versions"

  packages:
    - app
    - packages/*

  ide:
    intellij:
      enabled: false
