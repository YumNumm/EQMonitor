publish_to: "none"

environment:
  sdk: ^3.11.0
  flutter: ^3.44.0

resolution: workspace

dependencies:
  dio: ^5.8.0+1
  drift: ^2.33.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
