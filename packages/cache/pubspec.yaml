name: cache
description: HTTP ETag/304 cache + Drift SWR cache infrastructure for EQMonitor.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.11.0
  flutter: ^3.44.0

resolution: workspace

dependencies:
  dio: ^5.8.0+1
  dio_cache_interceptor: ^4.0.6
  http_cache_drift_store: ^7.0.0

dev_dependencies:
  altive_lints: ^2.1.0
  build_runner: ^2.7.1
  eqmonitor_lints:
    path: ../eqmonitor_lints
  http_mock_adapter: ^0.6.1
  test: ^1.29.0
