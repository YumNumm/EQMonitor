targets:
  $default:
    builders:
      # https://github.com/google/json_serializable.dart/tree/master/json_serializable#build-configuration
      json_serializable:
        options:
          # json のデシリアライズ時に発生する Exception を CheckedFromJsonException にまとめる
          checked: true
      # https://github.com/dart-lang/source_gen#ignore_for_file
      source_gen:combining_builder:
        options:
          ignore_for_file:
            - type=lint
            - type=warning
            - duplicate_ignore
            - unused_element_parameter
global_options:
  freezed:
    runs_before:
      - json_serializable
  json_serializable:
    runs_before:
      - retrofit_generator
