name: telemetry_store
description: Client-side telemetry event store backed by local SQLite (Drift)
version: 1.0.0

publish_to: "none"

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  drift: ^2.22.0
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.3.3

dev_dependencies:
  altive_lints: ^2.3.0
  build_runner: ^2.7.1
  drift_dev: ^2.22.0
  eqmonitor_lints:
    path: ../eqmonitor_lints
  freezed: ^3.2.3
  sqlite3: ^2.7.0
  test: ^1.29.0
