name: eqmonitor_map
description: EQMonitor専用のFlutter地図レンダラー。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0-29.0.dev
  flutter: ^3.47.0-1.0.pre-97

resolution: workspace

dependencies:
  dart_earcut: ^1.2.0
  data_assets: ^0.20.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  # YumNumm/flutter_scene fork の submodule。pin は third_party/flutter_scene の
  # submodule commit が正本（#1602）。
  flutter_scene:
    path: ../../third_party/flutter_scene/packages/flutter_scene
  freezed_annotation: ^3.1.0
  hooks: ^2.1.0
  pmtiles_v3:
    path: ../pmtiles_v3
  vector_math: ^2.4.2

dev_dependencies:
  build_runner: ^2.16.0
  eqmonitor_lints:
    path: ../eqmonitor_lints
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
dependency_overrides:
  scene:
    path: ../../third_party/flutter_scene/packages/scene

flutter:
  assets:
    - shaders/earthquake_overlay.shaderinterface.json
