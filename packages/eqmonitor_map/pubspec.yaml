dev_dependencies:
  build_runner: ^2.16.0
  eqmonitor_lints:
    path: ../eqmonitor_lints
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
dependency_overrides:
  scene:
    git:
      url: https://github.com/bdero/flutter_scene.git
      ref: 7f71993b7e2a0ab1d2f59726a406098709be7291 # 2026.08.03
      path: packages/scene
