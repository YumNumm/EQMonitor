name: dart_azarashi
description: A Dart implementation of QZQSM DCR Decoder (azarashi) - Decodes disaster and crisis management reports from QZSS satellites.
version: 1.0.0

publish_to: "none"

environment:
  sdk: ^3.10.0

resolution: workspace

executables:
  dart_azarashi: dart_azarashi

dependencies:
  args: ^2.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  altive_lints: ^1.14.1
  build_runner: ^2.7.1
  eqmonitor_lints:
    path: ../eqmonitor_lints
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  test: ^1.25.8
