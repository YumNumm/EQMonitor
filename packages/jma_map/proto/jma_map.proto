syntax = "proto3";

package net.yumnumm.eqmonitor.jma_map;


message JmaMap {
  repeated JmaMapData data = 1;

	message JmaMapData
	{
		JmaMapType   mapType = 1;

		enum JmaMapType
		{
			AREA_FORECAST_LOCAL_EEW = 0;
			AREA_FORECAST_LOCAL_E = 1;
			AREA_INFORMATION_CITY = 2;
			AREA_TSUNAMI = 3;
		}

		repeated JmaMapDataItem data = 2;

		message JmaMapDataItem {
			LatLngBounds bounds = 1;
			Property property = 2;
			LatLng polylabel = 3;
			repeated Polygon polygons = 4;

			message Polygon {
				repeated LatLng latLngs = 1;
			}

			message Property
			{
				optional string code = 1;
				optional string name = 2;
				optional string nameKana = 3;
			}
		}
	}
	message LatLngBounds {
		LatLng southWest = 1;
		LatLng northEast = 2;
	}

	message LatLng
	{
		double lat = 1;
		double lng = 2;
	}
}
