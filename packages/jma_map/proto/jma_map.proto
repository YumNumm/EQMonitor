syntax = "proto3";

package net.yumnumm.eqmonitor.jma_map;


message JmaMap {
  repeated JmaMapData data = 1;
  repeated TopoJSONMapData topoJsonData = 2;

	message JmaMapData
	{
		JmaMapType   mapType = 1;

		enum JmaMapType
		{
			// 緊急地震速報／府県予報区
			AREA_FORECAST_LOCAL_EEW = 0;
			// 地震情報／細分区域
			AREA_FORECAST_LOCAL_E = 1;
			// 市町村等（地震津波関係）
			AREA_INFORMATION_CITY = 2;
			// 津波予報区
			AREA_TSUNAMI = 3;
		}

		enum DataType {
			POLYGON = 0;
			MULTI_POLYGON = 1;
			LINE_STRING = 2;
			MULTI_LINE_STRING = 3;
		}

		repeated JmaMapDataItem data = 2;

		message JmaMapDataItem {
			LatLngBounds bounds = 1;
			Property property = 2;
			LatLng polylabel = 3;
			bytes bytes = 4;

			message Polygon {
				repeated LatLng latLngs = 1;
			}

			message Property
			{
				optional string code = 1;
				optional string name = 2;
				optional string nameKana = 3;
			}

		}
	}
	message LatLngBounds {
		LatLng southWest = 1;
		LatLng northEast = 2;
	}

	message LatLng
	{
		double lat = 1;
		double lng = 2;
	}

	// TopoJSON関連のメッセージ定義
	message TopoJSONMapData {
		JmaMapData.JmaMapType mapType = 1;
		string name = 2; // "AreaForecastLocalE" など
		repeated TopoJSONGeometry geometries = 3;
		repeated TopoJSONArc arcs = 4;
		LatLngBounds bounds = 5; // 全体の境界ボックス
	}

	message TopoJSONGeometry {
		string type = 1; // "Polygon", "MultiPolygon" など
		repeated TopoJSONArcIndices arcIndices = 2; // ネストされた配列構造
		JmaMapData.JmaMapDataItem.Property property = 3; // 既存のPropertyを再利用
		LatLngBounds bounds = 4; // ジオメトリごとの境界ボックス
	}

	message TopoJSONArcIndices {
		repeated int32 indices = 1; // 単一のarcを参照するインデックスの配列
	}

	message TopoJSONArc {
		repeated LatLng positions = 1; // 既存のLatLngを再利用
		LatLngBounds bounds = 2; // アークごとの境界ボックス
	}
}
