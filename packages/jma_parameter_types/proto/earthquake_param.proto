syntax = "proto3";

message EarthquakeParameter {
  EarthquakeParameterHeader header = 1;
  repeated EarthquakeParameterRegionItem regions = 2;
}

message EarthquakeParameterHeader {
  string version = 1;
  string changeTime = 2;
}

message EarthquakeParameterRegionItem {
  string code = 1;
  string name = 2;
  string nameKana = 3;
  repeated EarthquakeParameterCityItem cities = 4;
}

message EarthquakeParameterCityItem {
  string code = 1;
  string name = 2;
  string nameKana = 3;
  repeated EarthquakeParameterStationItem stations = 4;
}

message EarthquakeParameterStationItem {
  string code = 1;
  string name = 2;
  string nameKana = 3;
  double latitude = 4;
  double longitude = 5;
  StationStatus status = 6;
  StationOwner owner = 7;
  // 工学的基盤（Vs=400m/s）から地表に至る最大速度の増幅率
  double arv_400 = 8;
}


enum StationStatus {
  // 運用中
  OPERATIONAL = 0;

  // 変更
  CHANGE = 1;

  // 新規
  CREATED = 2;

  // 廃止
  DISCONTINUED = 3;
}


enum StationOwner {
  // 気象庁
  JMA = 0;

  // 都道府県
  PREFECTURE = 1;

  // 市町村
  CITY = 2;

  // 防災科研
  NIED = 3;

  // その他
  OTHERS = 100;
}
