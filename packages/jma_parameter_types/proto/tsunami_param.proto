syntax = "proto3";

message TsunamiParameter {
  TsunamiParameterHeader header = 1;
  repeated TsunamiParameterItem items = 2;
}

message TsunamiParameterHeader {
  string version = 1;
  string changeTime = 2;
}

message TsunamiParameterItem {
  // 津波予報区名
  string area = 1;

  // 都道府県
  string prefecture = 2;

  string code = 3;
  string name = 4;
  string nameKana = 5;
  string owner = 6;

  double latitude = 7;
  double longitude = 8;
}
