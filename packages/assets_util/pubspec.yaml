name: assets_util
version: 1.0.0
description: >
  Platform-managed local assets resolver via FFI (iOS) and JNI (Android).
  Not FlutterGen Assets. Intended for Background Assets / Play Asset Delivery later.

publish_to: "none"

environment:
  sdk: ^3.14.0-29.0.dev
  flutter: ^3.47.0-1.0.pre-97

resolution: workspace

flutter:
  plugin:
    platforms:
      android:
        package: net.yumnumm.assets_util
        pluginClass: AssetsUtilPlugin
        dartPluginClass: AssetsUtilAndroid
      # iOS uses Native Assets hook (live_activity_util 同型). No Flutter pluginClass.

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.5
  ffigen: ^20.1.1
  flutter:
    sdk: flutter
  hooks: ^2.0.0
  jni: ^1.0.0
  jni_flutter: ^1.0.1
  native_toolchain_c: ^0.19.0
  objective_c: ^9.2.2
  path: ^1.9.1

dev_dependencies:
  eqmonitor_lints:
    path: ../eqmonitor_lints
  flutter_test:
    sdk: flutter
  jnigen: ^0.16.0
