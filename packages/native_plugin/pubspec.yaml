name: native_plugin
description: Platform APIs called directly from Dart through FFIgen and JNIgen bindings.
version: 1.0.0

publish_to: "none"

environment:
  sdk: ^3.15.0-154.0.dev
  flutter: ^3.51.0-1.0.pre-176

resolution: workspace

dependencies:
  ffi: ^2.1.5
  freezed_annotation: ^3.0.0
  jni: ^1.2.1
  objective_c: ^9.6.0

dev_dependencies:
  build_runner: ^2.4.15
  eqmonitor_lints:
    path: ../eqmonitor_lints
  ffigen: ^23.0.0
  freezed: ^4.0.0-dev.3
  # 1.1.0 は jni 1.2.1 に無い JType.className を override するコードを生成する。
  jnigen: 1.0.1
  test: ^1.29.0
