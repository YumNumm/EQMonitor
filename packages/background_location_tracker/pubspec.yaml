name: background_location_tracker
description: Background location tracking plugin using significant location changes for iOS and Android.
version: 1.0.0

publish_to: "none"

environment:
  sdk: ^3.14.0-29.0.dev
  flutter: ^3.47.0-1.0.pre-97

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  pigeon: ^26.1.5

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: BackgroundLocationPlugin
        sharedDarwinSource: false
      android:
        package: net.yumnumm.background_location_tracker
        pluginClass: BackgroundLocationPlugin
