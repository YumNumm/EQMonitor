min_version = "2026.09.12"

[plugins]
flutter = "https://github.com/YumNumm/mise-flutter.git"
gcloud = "https://github.com/jthegedus/asdf-gcloud"

[tools]
"aqua:suzuki-shunsuke/tfcmt" = "latest"
java = "temurin-17.0.20+8"
gradle = "9.8.1"
node = "lts"
python = "latest"
# Exact dependency pins also raise the generated lock's Python floor to 3.10.
"pipx:codemagic-cli-tools" = { version = "0.70.0", with = ["PyJWT==2.14.0", "cryptography==49.0.0", "urllib3==2.8.0"] }
pnpm = "latest"
tflint = "latest"
uv = "latest"
xcbeautify = "latest"
gcloud = "latest"
terraform = "latest"
firebase = "latest"
yq = "latest"
pinact = "latest"
swiftformat = "latest"
shellcheck = "latest"
"github:YumNumm/google-play-cli" = "latest"
hk = "latest"
pkl = "latest"
zizmor = "latest"
ghalint = "latest"
"github:jdx/jactionlint" = "2.1.0"
gitleaks = "latest"
flutter = "19946f91c8d9de18a4674460d015229cc0b2534f"
"github:rorkai/App-Store-Connect-CLI" = { version = "latest", rename_exe = "asc" }

[settings]
lockfile = true

[env]
HK_MISE = "1"
FIREBASE_ANALYTICS_WITHOUT_ADID = "true"

[hooks]
postinstall = "hk install --mise"
