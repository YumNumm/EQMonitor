min_version = "2026.11.8"

[tool_alias]
flutter = "asdf:https://github.com/YumNumm/mise-flutter.git"

[tools]
"aqua:suzuki-shunsuke/tfcmt" = "latest"
java = "temurin-17.0.21+9"
gradle = "9.9.1"
node = "lts"
python = "latest"
# Exact dependency pins also raise the generated lock's Python floor to 3.10.
"pipx:codemagic-cli-tools" = { version = "0.71.0", with = ["PyJWT==2.15.0", "cryptography==50.0.2", "urllib3==2.8.0"] }
pnpm = "latest"
tflint = "latest"
uv = "latest"
xcbeautify = "latest"
gcloud = "latest"
terraform = "latest"
firebase = "latest"
yq = "latest"
pinact = "latest"
swiftformat = "latest"
shellcheck = "latest"
"github:YumNumm/google-play-cli" = "latest"
hk = "latest"
pkl = "latest"
zizmor = "latest"
ghalint = "1.5.6"
"github:jdx/jactionlint" = "2.6.0"
gitleaks = "latest"
flutter = "22e676c57e1e6d04c2289a47368ea4093bbc3c18"
"github:rorkai/App-Store-Connect-CLI" = { version = "latest", rename_exe = "asc" }

[settings]
lockfile = true

[env]
HK_MISE = "1"
FIREBASE_ANALYTICS_WITHOUT_ADID = "true"

[hooks]
postinstall = "hk install --mise"
