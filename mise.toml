min_version = "2026.09.12"

[plugins]
flutter = "https://github.com/YumNumm/mise-flutter.git"
gcloud = "https://github.com/jthegedus/asdf-gcloud"

[tools]
"aqua:suzuki-shunsuke/tfcmt" = "latest"
java = "temurin-17.0.20+8"
gradle = "9.7.1"
node = "lts"
python = "latest"
"pipx:codemagic-cli-tools" = "latest"
pnpm = "latest"
tflint = "latest"
uv = "latest"
xcbeautify = "latest"
gcloud = "latest"
terraform = "latest"
firebase = "latest"
yq = "latest"
pinact = "latest"
swiftformat = "latest"
shellcheck = "latest"
"github:YumNumm/google-play-cli" = "latest"
hk = "latest"
pkl = "latest"
zizmor = "latest"
ghalint = "latest"
gitleaks = "latest"
flutter = "19946f91c8d9de18a4674460d015229cc0b2534f"
"github:rorkai/App-Store-Connect-CLI" = { version = "latest", rename_exe = "asc" }

[settings]
lockfile = true
plugin_autoupdate_last_check_duration = "1 week"

[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"
