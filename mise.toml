min_version = "2026.08.0"

[tools]
"aqua:suzuki-shunsuke/tfcmt" = "latest"
java = "17"
node = "lts"
python = "latest"
"pipx:codemagic-cli-tools" = "latest"
pnpm = "latest"
tflint = "latest"
uv = "latest"
xcbeautify = "latest"
gcloud = "latest"
terraform = "latest"
firebase = "latest"
yq = "latest"
actionlint = "latest"
pinact = "latest"
swiftformat = "latest"
shellcheck = "latest"
"github:YumNumm/google-play-cli" = "latest"
hk = "latest"
pkl = "latest"
zizmor = "latest"
ghalint = "latest"
gitleaks = "latest"
claude = "latest"
swift = "latest"
flutter = "4dacd3fc91d96262a33e5c598e17d816f0b35641"

[settings]
lockfile = true
experimental = true
plugin_autoupdate_last_check_duration = "1 week"

[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"
