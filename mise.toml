min_version = "2026.08.0"

[plugins]
flutter = "https://github.com/YumNumm/mise-flutter.git"
gcloud = "https://github.com/jthegedus/asdf-gcloud"

[tools]
"aqua:suzuki-shunsuke/tfcmt" = "latest"
# NOTE: "17" は jdk.java.net の最終GA (17.0.2, 2022年) に解決され、GitHub Actions
# runner の cgroup v2 構成で JDK-8272124 系の NPE を起こす (lint worker が全滅する)。
# バグ修正済みの Temurin 17 を使う。
java = "temurin-17.0.20+8"
node = "lts"
python = "latest"
"pipx:codemagic-cli-tools" = "latest"
pnpm = "latest"
tflint = "latest"
uv = "latest"
xcbeautify = "latest"
gcloud = "latest"
terraform = "latest"
firebase = "latest"
yq = "latest"
actionlint = "latest"
pinact = "latest"
swiftformat = "latest"
shellcheck = "latest"
"github:YumNumm/google-play-cli" = "latest"
hk = "latest"
pkl = "latest"
zizmor = "latest"
ghalint = "latest"
gitleaks = "latest"
claude = "latest"
swift = "latest"
flutter = "4dacd3fc91d96262a33e5c598e17d816f0b35641"
"github:rorkai/App-Store-Connect-CLI" = { version = "latest", rename_exe = "asc" }

[settings]
lockfile = true
experimental = true
plugin_autoupdate_last_check_duration = "1 week"

[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"
