name: LiveActivityCompatibility
options:
  bundleIdPrefix: net.yumnumm.eqmonitor.tests
  deploymentTarget:
    iOS: "26.0"
packages:
  EQMonitorAPI:
    path: ${EQMONITOR_REPO_ROOT}/app/ios/Packages/EQMonitorAPI
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  LiveActivityCompatibilityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/Widget/LiveActivity
        excludes:
          - Unified/UnifiedLiveActivityPreviews.swift
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/Shared/IntensityValue.swift
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/Shared/ColorRGB.swift
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/Shared/DesignTokens.swift
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/Shared/IntensityBadge.swift
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/Shared/EewDisplay.swift
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/Shared/LiveActivityDate.swift
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/WidgetModelsTests/UnifiedLiveActivityTests.swift
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/WidgetModelsTests/EewDisplayTests.swift
      - path: ${EQMONITOR_REPO_ROOT}/app/ios/WidgetModelsTests/LiveActivityDateTests.swift
      - path: ${EQMONITOR_REPO_ROOT}/tool/live_activity_tests/RenderTests.swift
    dependencies:
      - package: EQMonitorAPI
    scheme:
      testTargets:
        - LiveActivityCompatibilityTests
