plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def dartDefines = [];
if (project.hasProperty('dart-defines')) {
    dartDefines = project.property('dart-defines')
            .split(',')
            .collectEntries { entry ->
                def pair = new String(entry.decodeBase64(), 'UTF-8').split('=')
                // valueがemptyの時にlastがkeyになるので、lengthが2でなければ空のmapにする
                pair.length == 2 ? [(pair.first()): pair.last()] : [:]
            }
}

task copySources(type: Copy) {
    from "src/${dartDefines.flavor}/res"
    into 'src/main/res'
}

tasks.whenTaskAdded { task ->
    task.dependsOn copySources
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'net.yumnumm.eqmonitor'
    buildToolsVersion '34.0.0'
    compileSdk 35

    compileOptions {
        // flutter_local_notificationsで利用
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId 'net.yumnumm.eqmonitor'
        if (dartDefines.appIdSuffix != null) {
            applicationIdSuffix = "${dartDefines.appIdSuffix}"
        }
        minSdkVersion 26
        targetSdkVersion 35
        multiDexEnabled true
        versionCode flutter.versionCode
        versionName flutter.versionName
        resValue "string", "app_name", "${dartDefines.appName}"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            resValue "string", "app_name", "EQMonitor"
        }
        debug {
            versionNameSuffix '.d'
            resValue "string", "app_name", "EQMonitor (Debug)"
        }
    }
    buildFeatures {
        viewBinding true
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.firebase:firebase-crashlytics:19.4.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
