# 公開リポジトリの ubuntu-24.04 Hosted Runner は 4 コア・16GB。
# Gradle と Kotlin daemon、Dart の AOT コンパイルが同時に動いても収まる量にする。

# From now in android
# https://github.com/android/nowinandroid

org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=4
# ~/.gradle/caches/build-cache-1 は Deploy App で run 間キャッシュする
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2g

kotlin.incremental=false

# Controls KotlinOptions.allWarningsAsErrors. This is used in CI and can be set in local properties.
warningsAsErrors=true

# Flutter related properties
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
# play-services-cronet が参照する cronet-api/shared の namespace 重複への暫定対処
# https://github.com/dart-lang/http/issues/1932
android.uniquePackageNames=false
