# ubuntuのGitHub Actions Hosted Runnerのメモリは7GBなので、JVMのメモリを少なめに設定する

# From now in android
# https://github.com/android/nowinandroid

org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4096m
org.gradle.workers.max=2

kotlin.incremental=false

# Controls KotlinOptions.allWarningsAsErrors. This is used in CI and can be set in local properties.
warningsAsErrors=true

# Flutter related properties
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false
# play-services-cronet が参照する cronet-api/shared の namespace 重複への暫定対処
# https://github.com/dart-lang/http/issues/1932
android.uniquePackageNames=false
