  #   git :
  #     url: git@github.com:YumNumm/flutter-maplibre.git
  #     ref: ios
  maplibre_gl:
    git:
      url: https://github.com/YumNumm/flutter-maplibre-gl.git
      ref: f40da2de85b4c30bb1f17ff647e49dfaa3056f1f
      path: maplibre_gl
  notification_setting_types:
    path: ../packages/notification_setting_types
  ntp: ^2.0.0
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  pointer_interceptor: ^0.10.1+2
  purchases_flutter: ^8.3.1
  riverpod_annotation: ^2.6.1
  screenshot: 3.0.0
  share_plus: ^10.1.3
  shared_preference_app_group: ^1.1.1
  shared_preferences: ^2.3.3
  sheet:
    git:
      url: https://github.com/YumNumm/modal_bottom_sheet.git
      branch: main
      path: sheet
  shorebird_code_push: ^2.0.2
  soft_edge_blur: ^0.1.3
  synchronized: ^3.3.0
  talker_dio_logger: ^4.5.2
  talker_flutter: ^4.5.2
  upgrader: ^11.3.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  version: ^3.0.2
  web_socket_client: ^0.1.5

dev_dependencies:
  altive_lints: ^1.16.0
  analyzer: ^6.11.0
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  dependency_validator: ^4.1.2
  eqmonitor_lints:
    path: ../packages/eqmonitor_lints
  fake_async: ^1.3.1
  flutter_gen_runner: ^5.8.0
  freezed: ^2.5.7
  go_router_builder: ^2.7.1
  json_serializable: ^6.9.0
  pedantic_mono: ^1.29.0
  retrofit_generator: ^9.1.5
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  test: ^1.25.7

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/theme/
    - assets/images/map/
    - assets/fonts/
    - assets/docs/
    - shorebird.yaml

  shaders:
    - shaders/introduction.frag

  fonts:
    - family: NotoSansJP
      fonts:
        # - asset: assets/fonts/NotoSansJP-Regular.ttf
          # weight: 400
        - asset: assets/fonts/NotoSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansJP-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 900
