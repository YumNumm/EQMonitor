dev_dependencies:
  build_runner: ^2.11.1
  eqmonitor_lints:
    path: ../packages/eqmonitor_lints
  fake_async: ^1.3.1
  flutter_gen_runner: ^5.8.0
  freezed: ^4.0.0-dev.3
  go_router_builder: ^4.3.0
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  shared_preferences_platform_interface: ^2.4.0
  test: ^1.29.0
  theme_tailor: ^3.1.3

flutter_gen:
  output: lib/core/gen/ # Optional (default: lib/gen/)
  line_length: 80

  integrations:
    image: true
    flutter_svg: true

flutter:
  config:
    enable-swift-package-manager: true
    # package:sqlite3 v3 はビルドフック(native assets)で libsqlite3 を同梱する。
    # 無効だと .so が同梱されず drift が起動時にクラッシュするため必須。
    enable-native-assets: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/theme/
    - assets/images/map/
    - assets/fonts/
    - assets/docs/
    - assets/parameter/
    - assets/parameters/
    - assets/debug/

  fonts:
    - family: NotoSansJP
      fonts:
        # - asset: assets/fonts/NotoSansJP-Regular.ttf
        # weight: 400
        - asset: assets/fonts/NotoSansJP/NotoSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP/NotoSansJP-Bold.ttf
          weight: 700
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex/GoogleSansFlex[GRAD,ROND,opsz,slnt,wdth,wght].ttf
    - family: GoogleSansCode
      fonts:
        - asset: assets/fonts/GoogleSansCode/GoogleSansCode[MONO,wght].ttf
        - asset: assets/fonts/GoogleSansCode/GoogleSansCode-Italic[MONO,wght].ttf
          style: italic
