name: eqmonitor
description: An earthquake monitoring Application
publish_to: "none"

version: 2.10.0

environment:
  sdk: 3.8.1
  flutter: 3.32.1

resolution: workspace

dependencies:
  adaptive_dialog: ^2.3.0
  app_settings: ^6.1.1
  background_task: ^0.2.0
  clock: ^1.1.1
  collection: ^1.19.1
  crypto: ^3.0.6
  data_table_2: ^2.5.16
  device_info_plus: ^11.2.0
  dio: ^5.8.0+1
  dynamic_color: ^1.7.0
  earthquake_replay:
    path: ../packages/earthquake_replay
  eqapi_client:
    path: ../packages/eqapi_client
  eqapi_types:
    path: ../packages/eqapi_types
  extensions:
    path: ../packages/extensions
  feedback: ^3.1.0
  file_picker: ^10.1.9
  firebase_analytics: ^12.0.0
  firebase_app_installations: ^0.4.0
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_email_sender: ^7.0.0
  flutter_hooks: ^0.21.2
  flutter_html: ^3.0.0
  flutter_local_notifications: ^19.2.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.5
  flutter_secure_storage: ^10.0.0-beta.4
  flutter_test:
    sdk: flutter
  freezed_annotation: ^3.0.0
  geobase: ^1.5.0
  geodata: ^1.3.0
  geolocator: ^14.0.1
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  hooks_riverpod: ^3.0.0-dev.16
  image: ^4.4.0
  in_app_review: ^2.0.10
  intl: ^0.20.2
  jma_code_table_types:
    path: ../packages/jma_code_table_types
  jma_map:
    path: ../packages/jma_map
  jma_parameter_api_client:
    path: ../packages/jma_parameter_api_client
  json_annotation: ^4.9.0
  kyoshin_monitor_api:
    path: ../packages/kyoshin_monitor_api
  kyoshin_monitor_image_parser:
    path: ../packages/kyoshin_monitor_image_parser
  kyoshin_observation_point_types:
    path: ../packages/kyoshin_observation_point_types
  lat_lng:
    path: ../packages/lat_lng
  latlong2: ^0.9.1
  # maplibre: ^0.2.1
  maplibre_gl: ^0.21.0
  ntp: ^2.0.0
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  pointer_interceptor: ^0.10.1+2
  purchases_flutter: ^9.1.0
  riverpod_annotation: ^3.0.0-dev.16
  screenshot: 3.0.0
  share_plus: ^11.0.0
  shared_preference_app_group: ^1.1.1
  shared_preferences: ^2.3.3
  sheet:
    git:
      url: https://github.com/YumNumm/modal_bottom_sheet.git
      ref: main
      path: sheet
  soft_edge_blur: ^0.1.3
  synchronized: ^3.3.0
  talker_dio_logger: ^4.5.2
  talker_flutter: ^4.5.2
  upgrader: ^11.3.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  version: ^3.0.2
  web_socket_client: ^0.2.1

dev_dependencies:
  altive_lints: ^1.16.0
  analyzer: ^7.3.0
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  dependency_validator: ^5.0.2
  eqmonitor_lints:
    path: ../packages/eqmonitor_lints
  fake_async: ^1.3.1
  flutter_gen_runner: ^5.8.0
  freezed: ^3.0.6
  go_router_builder: ^3.0.0
  json_serializable: ^6.9.0
  pedantic_mono: ^1.29.0
  retrofit_generator: ^9.1.9
  riverpod_generator: ^3.0.0-dev.16
  riverpod_lint: ^3.0.0-dev.16
  test: ^1.25.7

flutter_gen:
  output: lib/core/gen/ # Optional (default: lib/gen/)
  line_length: 80

  integrations:
    image: true
    flutter_svg: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/theme/
    - assets/images/map/
    - assets/fonts/
    - assets/docs/
    - assets/parameter/

  shaders:
    - shaders/introduction.frag

  fonts:
    - family: NotoSansJP
      fonts:
        # - asset: assets/fonts/NotoSansJP-Regular.ttf
          # weight: 400
        - asset: assets/fonts/NotoSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansJP-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 900
