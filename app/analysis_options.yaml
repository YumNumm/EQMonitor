include: ../analysis_options.yaml
analyzer:
  errors:
    avoid_print: ignore
    document_ignores: ignore
    invalid_annotation_target: ignore
    lines_longer_than_80_chars: ignore
    unnecessary_async: ignore
  exclude:
    - "**/DerivedData/**"
    - "**/build/**"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
