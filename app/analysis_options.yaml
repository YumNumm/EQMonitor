include: package:eqmonitor_lints/analysis_options.yaml
analyzer:
  errors:
    avoid_implementing_value_types: ignore
    avoid_print: ignore
    document_ignores: ignore
    lines_longer_than_80_chars: ignore
  enable-experiment:
    - dot-shorthands

custom_lint:
  rules:
    - prefer_clock_now: false
    - avoid_hardcoded_color: false
    - avoid_hardcoded_japanese: false
    - avoid_single_child: false
